<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121d"/>
      <stop offset="0.5" stop-color="#0b1724"/>
      <stop offset="1" stop-color="#eef7fb"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#c8edff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#03101c" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <circle cx="1450" cy="130" r="360" fill="#38bdf8" opacity="0.09"/>
  <circle cx="220" cy="1040" r="420" fill="#10b981" opacity="0.08"/>

  <g opacity="0.18" stroke="#b7e8ff" stroke-width="1">
    <path d="M80 210 C280 120 460 300 660 190 S1040 150 1280 260 1580 130 1720 210" fill="none"/>
    <path d="M120 1010 C380 850 610 1050 860 890 S1340 880 1660 1000" fill="none"/>
    <path d="M100 720 H1700"/>
    <path d="M100 780 H1700"/>
    <path d="M100 840 H1700"/>
  </g>

  <g>
    <text x="90" y="96" fill="#ffffff" font-size="54" font-weight="800">AEGIS Scam Guard</text>
    <text x="92" y="135" fill="#b8c7d6" font-size="24">WhatsApp-native autonomous scam detection agent on Gemini and Google Cloud</text>
    <rect x="90" y="168" width="265" height="42" rx="21" fill="#10b981"/>
    <text x="222" y="196" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Live WhatsApp Bot</text>
    <rect x="374" y="168" width="250" height="42" rx="21" fill="#0ea5e9"/>
    <text x="499" y="196" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Google Cloud Hosted</text>
  </g>

  <g transform="translate(1250 72)">
    <rect x="0" y="0" width="456" height="150" rx="26" fill="#ffffff" opacity="0.92" filter="url(#softShadow)"/>
    <text x="34" y="48" fill="#0f172a" font-size="24" font-weight="800">Production proof</text>
    <text x="34" y="82" fill="#334155" font-size="17">Cloud Run traffic, live logs, WhatsApp replies</text>
    <text x="34" y="116" fill="#334155" font-size="17">and CI-backed deployable services.</text>
  </g>

  <g transform="translate(72 284)">
    <rect x="0" y="0" width="1656" height="706" rx="38" fill="#ffffff" opacity="0.95" filter="url(#softShadow)"/>
    <text x="46" y="58" fill="#0f172a" font-size="27" font-weight="800">End-to-end agent architecture</text>
    <text x="46" y="91" fill="#64748b" font-size="17">Decoupled services, typed events, encrypted identity, multimodal analysis, and asynchronous follow-up.</text>

    <g transform="translate(46 132)">
      <rect x="0" y="0" width="260" height="426" rx="26" fill="#f8fafc" stroke="#dbeafe" stroke-width="2"/>
      <circle cx="130" cy="94" r="55" fill="#dcfce7"/>
      <path d="M118 72 h24 a20 20 0 0 1 20 20 v28 a20 20 0 0 1 -20 20 h-10 l-20 18 v-18 h-12 a20 20 0 0 1 -20 -20 V92 a20 20 0 0 1 20 -20z" fill="#10b981"/>
      <text x="130" y="194" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="800">User</text>
      <text x="130" y="226" text-anchor="middle" fill="#475569" font-size="16">forwards suspicious</text>
      <text x="130" y="250" text-anchor="middle" fill="#475569" font-size="16">text, links, images,</text>
      <text x="130" y="274" text-anchor="middle" fill="#475569" font-size="16">or voice notes</text>
      <rect x="38" y="322" width="184" height="50" rx="25" fill="#0f172a"/>
      <text x="130" y="354" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">WhatsApp Cloud API</text>
    </g>

    <path d="M328 348 C380 348 398 348 448 348" fill="none" stroke="#0ea5e9" stroke-width="5" marker-end="url(#arrowBlue)"/>

    <g transform="translate(448 132)">
      <rect x="0" y="0" width="300" height="426" rx="26" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
      <text x="150" y="54" text-anchor="middle" fill="#0369a1" font-size="24" font-weight="800">Ingestion</text>
      <text x="150" y="82" text-anchor="middle" fill="#475569" font-size="16">Cloud Run public webhook</text>
      <line x1="34" y1="112" x2="266" y2="112" stroke="#bae6fd"/>
      <text x="42" y="154" fill="#0f172a" font-size="17" font-weight="700">1. Verify Meta signature</text>
      <text x="42" y="194" fill="#0f172a" font-size="17" font-weight="700">2. Normalize payload</text>
      <text x="42" y="234" fill="#0f172a" font-size="17" font-weight="700">3. Resolve media to GCS</text>
      <text x="42" y="274" fill="#0f172a" font-size="17" font-weight="700">4. Hash sender identity</text>
      <rect x="38" y="330" width="224" height="54" rx="18" fill="#ffffff" stroke="#bae6fd"/>
      <text x="150" y="363" text-anchor="middle" fill="#0369a1" font-size="16" font-weight="700">No model calls here</text>
    </g>

    <path d="M748 348 C802 348 826 348 878 348" fill="none" stroke="#0ea5e9" stroke-width="5" marker-end="url(#arrowBlue)"/>

    <g transform="translate(878 148)">
      <rect x="0" y="0" width="260" height="174" rx="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="130" y="54" text-anchor="middle" fill="#1d4ed8" font-size="24" font-weight="800">Pub/Sub</text>
      <text x="130" y="82" text-anchor="middle" fill="#475569" font-size="16">incoming-reports topic</text>
      <text x="130" y="118" text-anchor="middle" fill="#334155" font-size="16">push subscription</text>
      <text x="130" y="144" text-anchor="middle" fill="#334155" font-size="16">dead-letter queue</text>
    </g>

    <g transform="translate(878 388)">
      <rect x="0" y="0" width="260" height="170" rx="26" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
      <text x="130" y="52" text-anchor="middle" fill="#b45309" font-size="22" font-weight="800">Async Follow-up</text>
      <text x="130" y="84" text-anchor="middle" fill="#475569" font-size="16">Cloud Scheduler</text>
      <text x="130" y="112" text-anchor="middle" fill="#475569" font-size="16">Cloud Run Job</text>
      <text x="130" y="140" text-anchor="middle" fill="#334155" font-size="16">checks back later</text>
    </g>

    <path d="M1138 235 C1192 235 1214 235 1266 235" fill="none" stroke="#10b981" stroke-width="5" marker-end="url(#arrowGreen)"/>

    <g transform="translate(1266 108)">
      <rect x="0" y="0" width="334" height="512" rx="30" fill="url(#agent)" filter="url(#softShadow)"/>
      <rect x="18" y="18" width="298" height="476" rx="24" fill="#062a31" opacity="0.82"/>
      <text x="167" y="64" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="850">ADK Agent</text>
      <text x="167" y="94" text-anchor="middle" fill="#baf7ea" font-size="16">Gemini on Vertex AI</text>

      <g fill="#ffffff" font-size="15" font-weight="700">
        <rect x="45" y="132" width="244" height="42" rx="21" fill="#0f766e"/>
        <text x="167" y="159" text-anchor="middle">analyze_content</text>
        <rect x="45" y="188" width="244" height="42" rx="21" fill="#0369a1"/>
        <text x="167" y="215" text-anchor="middle">check_sender_reputation</text>
        <rect x="45" y="244" width="244" height="42" rx="21" fill="#155e75"/>
        <text x="167" y="271" text-anchor="middle">cross_reference_reports</text>
        <rect x="45" y="300" width="244" height="42" rx="21" fill="#047857"/>
        <text x="167" y="327" text-anchor="middle">draft_protective_action</text>
        <rect x="45" y="356" width="244" height="42" rx="21" fill="#0f172a"/>
        <text x="167" y="383" text-anchor="middle">escalate_or_close</text>
      </g>

      <circle cx="167" cy="450" r="33" fill="#10b981" filter="url(#glow)"/>
      <path d="M151 450 l10 11 l24 -25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(46 574)">
      <rect x="0" y="0" width="720" height="122" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <text x="34" y="44" fill="#0f172a" font-size="20" font-weight="800">Privacy and governance boundary</text>
      <text x="34" y="76" fill="#475569" font-size="16">PII redaction, prompt-injection defense, HMAC user IDs,</text>
      <text x="34" y="101" fill="#475569" font-size="16">Secret Manager, and Cloud KMS encrypted contact directory</text>
    </g>

    <g transform="translate(800 574)">
      <rect x="0" y="0" width="420" height="122" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <text x="34" y="44" fill="#0f172a" font-size="20" font-weight="800">Persistent memory and evidence</text>
      <text x="34" y="76" fill="#475569" font-size="16">Firestore reports, reasoning traces,</text>
      <text x="34" y="101" fill="#475569" font-size="16">global patterns, and due follow-ups</text>
    </g>
  </g>

  <g transform="translate(90 1040)">
    <text x="0" y="0" fill="#ffffff" font-size="28" font-weight="800">What judges can verify</text>
    <text x="0" y="42" fill="#cbd5e1" font-size="18">Live WhatsApp bot -> Cloud Run logs -> Pub/Sub processing -> Gemini agent reasoning -> WhatsApp verdict</text>
    <text x="0" y="78" fill="#94a3b8" font-size="16">Created by Srimonishan | srimonishan.com</text>
  </g>
</svg>
